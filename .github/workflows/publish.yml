name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  # Required for npm provenance attestation.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Check the npm token is actually set
        # An empty secret reaches npm as no credential at all and fails with
        # ENEEDAUTH only after a full build. `gh secret set` with no --body
        # stores an empty value when stdin isn't a TTY, which is easy to do
        # by accident, so check before spending the build.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN is empty or unset. Set it with:" >&2
            echo "  gh secret set NPM_TOKEN --repo ${{ github.repository }} --body \"\$YOUR_TOKEN\"" >&2
            exit 1
          fi
      - run: npm ci
      - name: Check tag matches package.json version
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "$GITHUB_REF_NAME" ]; then
            echo "package.json is $pkg but tag is $GITHUB_REF_NAME" >&2
            exit 1
          fi
      # prepublishOnly runs lint + typecheck + tests as the gate.
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
