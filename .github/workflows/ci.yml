name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep real-bd integration runs local and telemetry-free.
  BD_DISABLE_METRICS: "1"
  DO_NOT_TRACK: "1"
  BD_DISABLE_EVENT_FLUSH: "1"
  DOLT_DISABLE_EVENT_FLUSH: "1"
  OTEL_SDK_DISABLED: "true"

jobs:
  check:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      # No bd on this runner: the integration suite skips itself.
      - run: npm test

  integration:
    name: Integration tests against real bd
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - name: Install beads
        run: brew install beads
      - run: npm ci
      - run: npm test
